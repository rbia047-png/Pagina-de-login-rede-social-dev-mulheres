<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DevGirls</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-image: url("./fundopagina.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        /* Cabeçalho */
        .cabeçario {
            display: flex;
            align-items: center;
            justify-content: center;
            width: calc(100% - 30px);
            min-height: 60px;
            margin: 15px auto 0;
            padding: 10px;
            background-color: rgb(165, 0, 129);
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            color: black;
            font-size: 28px;
        }

        /* Logo da rede social */
        .logoredesocial {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }

        .logoredesocial img {
            width: 300px;
            max-width: 80%;
            height: auto;
            object-fit: contain;
        }

        /* Centralização do login */
        .conteiner {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px 15px 40px;
        }

        /* Caixa de login */
        .login {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;

            width: 100%;
            max-width: 500px;
            padding: 30px 25px;

            background-color: rgb(165, 0, 129);
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .login img {
            width: 100px;
            max-width: 100%;
            height: auto;
            border-radius: 50%;
            object-fit: cover;
        }

        .login h1 {
            text-align: center;
            font-size: 28px;
        }

        /* Formulário */
        .login form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .login input {
            width: 100%;
            min-height: 45px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .login input:focus {
            outline: 2px solid #ff69b4;
            border-color: #ff1493;
        }

        .login button {
            width: 100%;
            min-height: 45px;
            background-color: white;
            color: rgb(165, 0, 129);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login button:hover {
            background-color: #ffe0f1;
        }

        /* Links */
        .esqueceu-senha {
            display: block;
            text-align: right;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .esqueceu-senha:hover {
            text-decoration: underline;
            color: #ffb6e0;
        }

        .criarconta {
            text-align: center;
            color: white;
            text-decoration: underline;
        }

        .criarconta:hover {
            color: #ffb6e0;
        }

        /* Tablets e celulares */
        @media (max-width: 768px) {
            .cabeçario {
                min-height: 55px;
            }

            h1 {
                font-size: 24px;
            }

            .logoredesocial {
                margin: 15px auto;
            }

            .logoredesocial img {
                width: 220px;
            }

            .conteiner {
                padding-top: 10px;
            }

            .login {
                max-width: 420px;
                padding: 25px 20px;
            }
        }

        /* Celulares pequenos */
        @media (max-width: 400px) {
            .cabeçario {
                width: calc(100% - 20px);
                border-radius: 12px;
            }

            h1 {
                font-size: 21px;
            }

            .logoredesocial img {
                width: 180px;
            }

            .conteiner {
                padding: 10px 10px 30px;
            }

            .login {
                padding: 22px 15px;
                border-radius: 15px;
            }

            .login h1 {
                font-size: 24px;
            }

            .login input,
            .login button {
                font-size: 15px;
            }
        }
/* Rodapé */
.rodape {
    width: 100%;
    background-color: #a50081;
    color: white;

    text-align: center;
    padding: 25px 15px;

    margin-top: auto;
}

/* Nome da rede social */
.rodape h2 {
    font-size: 25px;
    margin-bottom: 10px;
    color: white;
}

/* Frase */
.rodape p {
    font-size: 14px;
    margin-bottom: 15px;
}

/* Links */
.links-rodape {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 20px;
}

.links-rodape a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.links-rodape a:hover {
    color: #ffc0cb;
    text-decoration: underline;
}

/* Direitos autorais */
.rodape .copyright {
    margin-bottom: 0;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    font-size: 12px;
}

/* Responsividade */
@media (max-width: 480px) {
    .rodape {
        padding: 20px 12px;
    }

    .rodape h2 {
        font-size: 22px;
    }

    .links-rodape {
        flex-direction: column;
        gap: 12px;
    }
}
    </style>
</head>

<body>

    <header>
        <div class="cabeçario">
            <h1>Seja Bem-vinda!</h1>
        </div>

        <div class="logoredesocial">
            <img src="./logoredesocial.png"
                 alt="Logo da rede social DevGirls">
        </div>
    </header>

    <main>
        <div class="conteiner">
            <div class="login">

                <img src="./login.jpg" alt="Imagem de perfil">

                <h1>Entrar</h1>

                <form>
                    <input type="email"
                           placeholder="Digite seu e-mail"
                           aria-label="E-mail"
                           required>

                    <input type="password"
                           placeholder="Digite sua senha"
                           aria-label="Senha"
                           required>

                    <a href="./index1.html"
                       class="esqueceu-senha"
                       target="_blank"
                       rel="noopener noreferrer">
                        Esqueci minha senha
                    </a>

                    <button type="submit">Entrar</button>

                    <a href="./index2.html"
                       class="criarconta"
                       target="_blank"
                       rel="noopener noreferrer">
                        Criar conta
                    </a>
                </form>

            </div>
        </div>
    </main>
