<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha </title>
</head>
<body>
<div class="trocasenha">
    <form id="formSenha">

        <h2>Redefinir Senha</h2>

        <input type="password" id="senha"
        placeholder="Digite nova senha" required>

        <input type="password" id="confirmaSenha"
        placeholder="Confirme a senha" required>

        <button type="submit">Enviar</button>

        <p id="mensagem"></p>

    </form>
</div>
    <style>
body {
    background-image: url(./fundopagina.png);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    /* Centraliza o container na tela */
    display: flex;
    justify-content: center;
    align-items: center;

    /* Ocupa a altura da tela */
    min-height: 100vh;
    margin: 0;
}

.trocasenha {
    display: flex;
    align-items: center;
    justify-content: center;

    background-color: rgb(255, 192, 203);
    color: rgb(165, 0, 129);

    width: 300px;
    height: 310px;

    border-radius: 20px;
}

.trocasenha form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.trocasenha input {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #a50081;
}

.trocasenha button {
    padding: 12px;
    background-color: #a50081;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
    </style>
<script>
const formulario = document.getElementById("formSenha");

formulario.addEventListener("submit", function(event) {
    event.preventDefault();

    const senha = document.getElementById("senha").value;
    const confirmaSenha = document.getElementById("confirmaSenha").value;
    const mensagem = document.getElementById("mensagem");

    if (senha !== confirmaSenha) {
        mensagem.textContent = "As senhas não são iguais!";
        mensagem.style.color = "red";
    } else {
        mensagem.textContent = "Sua senha foi alterada com sucesso!";
        mensagem.style.color = "green";
    }
});
</script>
</body>
</html>
