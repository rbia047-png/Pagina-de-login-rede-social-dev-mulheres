<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir Senha | DevGirls</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url("./fundopagina.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .trocasenha {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 400px;
            min-height: 310px;

            padding: 30px 25px;

            background-color: rgb(255, 192, 203);
            color: rgb(165, 0, 129);

            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .trocasenha form {
            display: flex;
            flex-direction: column;
            gap: 15px;

            width: 100%;
        }

        .trocasenha h2 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .trocasenha input {
            width: 100%;
            min-height: 45px;

            padding: 12px;

            border-radius: 8px;
            border: 1px solid #a50081;

            font-size: 16px;
        }

        .trocasenha input:focus {
            outline: 2px solid #ff69b4;
        }

        .trocasenha button {
            width: 100%;
            min-height: 45px;

            padding: 12px;

            background-color: #a50081;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            cursor: pointer;
        }

        .trocasenha button:hover {
            background-color: #800064;
        }

        #mensagem {
            text-align: center;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        /* Tablets */
        @media (max-width: 768px) {
            .trocasenha {
                max-width: 360px;
                padding: 25px 20px;
            }

            .trocasenha h2 {
                font-size: 24px;
            }
        }

        /* Celulares */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .trocasenha {
                width: 100%;
                max-width: 340px;
                min-height: auto;
                padding: 25px 18px;
                border-radius: 15px;
            }

            .trocasenha h2 {
                font-size: 22px;
            }

            .trocasenha input,
            .trocasenha button {
                font-size: 15px;
            }
        }

        /* Celulares muito pequenos */
        @media (max-width: 320px) {
            body {
                padding: 10px;
            }

            .trocasenha {
                padding: 20px 12px;
            }

            .trocasenha h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="trocasenha">
        <form id="formSenha">

            <h2>Redefinir Senha</h2>

            <input
                type="password"
                id="senha"
                placeholder="Digite nova senha"
                required
            >

            <input
                type="password"
                id="confirmaSenha"
                placeholder="Confirme a senha"
                required
            >

            <button type="submit">Enviar</button>

            <p id="mensagem" role="status" aria-live="polite"></p>

        </form>
    </div>

    <script>
        const formulario = document.getElementById("formSenha");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const senha = document.getElementById("senha").value;
            const confirmaSenha = document.getElementById("confirmaSenha").value;
            const mensagem = document.getElementById("mensagem");

            if (senha !== confirmaSenha) {
                mensagem.textContent = "As senhas não são iguais!";
                mensagem.style.color = "red";
            } else {
                mensagem.textContent =
                    "Sua senha foi alterada com sucesso!";
                mensagem.style.color = "green";
            }
        });
    </script>

</body>
</html>
</script>
</body>
</html>
